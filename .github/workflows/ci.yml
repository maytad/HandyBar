name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint formatting
        run: xcrun swift-format lint --strict --recursive App Packages

      - name: Check feature target imports
        run: scripts/check-feature-imports.sh

      - name: Test package
        run: swift test --package-path Packages/HandyBarKit

      - name: Build app
        run: >
          xcodebuild -project HandyBar.xcodeproj -scheme HandyBar -configuration Debug
          -derivedDataPath build/DerivedData build
